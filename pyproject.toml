[tool.poetry]
name = "agentkit"
version = "0.1.0"
description = "SDK for building networkkit bus participants — adapters, bridges, and services"
readme = "README.md"
license = "MIT"
authors = ["Vikram Kumar <vik@japanvik.net>"]
keywords = ["agents", "message bus", "networkkit", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python"
]

[tool.poetry.dependencies]
python = ">=3.10"
networkkit = ">=0.0.2"
python-dotenv = "*"
aiohttp = "*"
pyzmq = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"

[tool.poetry.urls]
Repository = "https://github.com/japanvik/agentkit"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
